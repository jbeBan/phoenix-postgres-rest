# Local development stack: Postgres, a one-shot migration, and the API.
#   docker compose up --build        # API on http://localhost:4000
# The credentials below are for local use only.
name: phoenix-postgres-rest

# migrate and api run the same image: one `image:` name means one build, not two.
x-app: &app
  image: survey-api:dev
  build: .
  environment:
    DATABASE_URL: ecto://postgres:postgres@db:5432/survey_api
    SECRET_KEY_BASE: local-only-secret-key-base-local-only-secret-key-base-local-only-secret-key-base-0000
    PORT: "4000"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: survey_api
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Also creates the survey_api_test and survey_api_explain databases (first start only).
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5435}:5432" # for running mix test / mix survey_api.explain from the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d survey_api"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    command: ["bin/migrate"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
